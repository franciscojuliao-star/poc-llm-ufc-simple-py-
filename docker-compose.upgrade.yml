services:
  postgres_upgrade:
    image: postgres:16
    container_name: fastapi_upgrade_basico_postgres
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
    environment:
      POSTGRES_USER: poc_user
      POSTGRES_PASSWORD: poc123
      POSTGRES_DB: poc_llm_simple_py
    ports:
      - "5434:5432"
    volumes:
      - postgres_upgrade_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc_user -d poc_llm_simple_py"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - upgrade-network

  redis_upgrade:
    image: redis:7-alpine
    container_name: fastapi_upgrade_basico_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_upgrade_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - upgrade-network

  api_upgrade:
    build: .
    image: fastapi_upgrade_basico
    container_name: fastapi_upgrade_basico
    env_file:
      - .env
    environment:
      DB_URL: postgresql://poc_user:poc123@postgres_upgrade:5432/poc_llm_simple_py
      ASYNC_DB_URL: postgresql+asyncpg://poc_user:poc123@postgres_upgrade:5432/poc_llm_simple_py
      REDIS_URL: redis://redis_upgrade:6379/0
      UPLOAD_DIR: /code/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres_upgrade:
        condition: service_healthy
      redis_upgrade:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - uploads_upgrade_data:/code/uploads
    restart: unless-stopped
    networks:
      - upgrade-network

volumes:
  postgres_upgrade_data:
  redis_upgrade_data:
  uploads_upgrade_data:

networks:
  upgrade-network:
    driver: bridge
